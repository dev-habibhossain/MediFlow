<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Your Email — MediFlow</title>
<meta name="description" content="Please verify your email address to complete your MediFlow account setup.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; background: none; border: 0; color: inherit; }

:root {
  --cream:      #F8F6EF;
  --cream-alt:  #F0EEE3;
  --card:       #FFFFFF;
  --lime:       #DDF15C;
  --lime-soft:  #EEF7C4;
  --lime-text:  #3B4A12;
  --forest:     #16301F;
  --forest-2:   #1E4029;
  --ink:        #16180F;
  --ink-muted:  #62655A;
  --line:       #E7E3D3;
  --gray-card:  #EFEDE4;

  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;

  --shadow-card: 0 1px 2px rgba(22,24,15,0.04), 0 8px 24px rgba(22,24,15,0.06);
  --shadow-lift: 0 4px 10px rgba(22,24,15,0.06), 0 16px 36px rgba(22,24,15,0.10);
}

body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--cream);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.wrap { max-width: 1320px; margin-inline: auto; padding-inline: 32px; position: relative; width: 100%; }
@media (max-width: 640px) { .wrap { padding-inline: 20px; } }

a:focus-visible, button:focus-visible { outline: 2px solid var(--forest); outline-offset: 3px; border-radius: 4px; }

/* ============ BUTTONS & PILLS ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 28px; border-radius: 999px; font-size: 15px; font-weight: 600; transition: transform 150ms ease, background-color 150ms ease, box-shadow 150ms ease; width: 100%; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--forest); color: #fff; box-shadow: var(--shadow-card); }
.btn-primary:hover { background: var(--forest-2); box-shadow: var(--shadow-lift); }
.btn-outline { background: transparent; color: var(--ink); border: 1.5px solid rgba(22,24,15,0.16); }
.btn-outline:hover { border-color: var(--ink); }

/* ============ HEADER ============ */
.site-header { padding-top: 20px; }
.nav-shell { display: flex; align-items: center; justify-content: space-between; background: rgba(248,246,239,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(22,24,15,0.06); border-radius: 999px; padding: 8px 12px 8px 22px; box-shadow: var(--shadow-card); }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.logo-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--forest); display: flex; align-items: center; justify-content: center; }
.logo-mark svg { width: 17px; height: 17px; color: var(--lime); }
.header-link { font-size: 14px; font-weight: 600; color: var(--forest); padding: 8px 16px; border-radius: 999px; transition: background-color 150ms ease; }
.header-link:hover { background: rgba(22,24,15,0.05); }

/* ============ MAIN AUTH LAYOUT ============ */
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 0; position: relative; }

/* DECORATIVE BLOBS */
.blob { position: fixed; border-radius: 50%; filter: blur(70px); pointer-events: none; z-index: 0; }
.blob-1 { top: -100px; right: -120px; width: 400px; height: 400px; background: radial-gradient(circle, #C7E86B 0%, transparent 70%); opacity: 0.5; }
.blob-2 { bottom: 5%; left: -140px; width: 360px; height: 380px; background: radial-gradient(circle, #B7DD5E 0%, transparent 70%); opacity: 0.35; }
@media (max-width: 900px) { .blob { display: none; } }

/* AUTH CARD */
.auth-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-xl); padding: 40px 36px; max-width: 460px; width: 100%; box-shadow: var(--shadow-lift); position: relative; z-index: 1; text-align: center; }
@media (max-width: 480px) { .auth-card { padding: 32px 24px; border-radius: var(--radius-lg); } }

.icon-badge { margin: 0 auto 20px; width: 56px; height: 56px; border-radius: 16px; background: var(--lime-soft); color: var(--lime-text); display: flex; align-items: center; justify-content: center; }
.icon-badge svg { width: 28px; height: 28px; }

.auth-card h1 { font-size: 24px; font-weight: 800; color: var(--forest); letter-spacing: -0.015em; margin-bottom: 8px; }
.auth-card p.lead { font-size: 14.5px; color: var(--ink-muted); line-height: 1.55; margin-bottom: 24px; }
.auth-card b { color: var(--ink); }

/* QUICK MAIL SHORTCUTS */
.mail-shortcuts { display: flex; gap: 10px; margin-bottom: 24px; }
.mail-btn { flex: 1; height: 44px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--cream); font-size: 13.5px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; transition: border-color 150ms ease, background-color 150ms ease; }
.mail-btn:hover { border-color: var(--forest); background: var(--card); }
.mail-btn svg { width: 16px; height: 16px; }

/* RESEND TIMER BLOCK */
.resend-block { background: var(--cream); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; margin-bottom: 24px; }
.resend-block p { font-size: 13px; color: var(--ink-muted); margin-bottom: 6px; }
.resend-btn { font-size: 13.5px; font-weight: 700; color: var(--forest); cursor: pointer; text-decoration: underline; }
.resend-btn:disabled { color: var(--ink-muted); text-decoration: none; cursor: not-allowed; opacity: 0.6; }

/* FOOTER CALLOUT */
.auth-footer { text-align: center; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink-muted); }
.auth-footer a { font-weight: 700; color: var(--forest); }
.auth-footer a:hover { text-decoration: underline; }

</style>
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header class="site-header">
  <div class="wrap">
    <div class="nav-shell">
      <a href="/" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-9.5-8.5C.6 8.9 2.3 5 6 5c2 0 3.3 1.1 4 2 .7-.9 2-2 4-2 3.7 0 5.4 3.9 3.5 7.5C19 16.65 12 21 12 21z"/></svg></span>
        MediFlow
      </a>
      <a href="/login.html" class="header-link">← Back to sign in</a>
    </div>
  </div>
</header>

<main>
  <div class="auth-card">
    
    <div class="icon-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </div>

    <h1>Check your email</h1>
    <p class="lead">We sent a verification link to <b id="userEmail">habib@example.com</b>. Click the link inside to verify your account.</p>

    <!-- QUICK MAIL PROVIDER LINKS -->
    <div class="mail-shortcuts">
      <a href="https://mail.google.com" target="_blank" class="mail-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> Gmail
      </a>
      <a href="https://outlook.live.com" target="_blank" class="mail-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg> Outlook
      </a>
    </div>

    <!-- RESEND SECTION WITH COUNTDOWN -->
    <div class="resend-block">
      <p>Didn't receive the email? Check your spam folder or request a new link.</p>
      <button class="resend-btn" id="resendBtn" disabled onclick="handleResend()">Resend email (<span id="timer">59</span>s)</button>
    </div>

    <a href="/patient-dashboard.html" class="btn btn-outline">Skip for now</a>

    <div class="auth-footer">
      Wrong email address? <a href="/register.html">Change email</a>
    </div>

  </div>
</main>

<script>
// COUNTDOWN TIMER FOR RESEND BUTTON
let countdown = 59;
const timerSpan = document.getElementById('timer');
const resendBtn = document.getElementById('resendBtn');

const interval = setInterval(() => {
  countdown--;
  timerSpan.textContent = countdown;
  if (countdown <= 0) {
    clearInterval(interval);
    resendBtn.disabled = false;
    resendBtn.textContent = 'Resend verification email';
  }
}, 1000);

function handleResend() {
  alert('A new verification email has been sent!');
  resendBtn.disabled = true;
  countdown = 60;
  resendBtn.innerHTML = 'Resend email (<span id="timer">60</span>s)';
  
  const newInterval = setInterval(() => {
    countdown--;
    document.getElementById('timer').textContent = countdown;
    if (countdown <= 0) {
      clearInterval(newInterval);
      resendBtn.disabled = false;
      resendBtn.textContent = 'Resend verification email';
    }
  }, 1000);
}
</script>

</body>
</html>
