<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account — MediFlow</title>
<meta name="description" content="Register for a new MediFlow patient account to book specialist appointments, access medical records, and manage family care online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; background: none; border: 0; color: inherit; }
input { font: inherit; }

:root {
  --cream:      #F8F6EF;
  --cream-alt:  #F0EEE3;
  --card:       #FFFFFF;
  --lime:       #DDF15C;
  --lime-soft:  #EEF7C4;
  --lime-text:  #3B4A12;
  --forest:     #16301F;
  --forest-2:   #1E4029;
  --ink:        #16180F;
  --ink-muted:  #62655A;
  --line:       #E7E3D3;
  --gray-card:  #EFEDE4;

  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;

  --shadow-card: 0 1px 2px rgba(22,24,15,0.04), 0 8px 24px rgba(22,24,15,0.06);
  --shadow-lift: 0 4px 10px rgba(22,24,15,0.06), 0 16px 36px rgba(22,24,15,0.10);
}

body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--cream);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.wrap { max-width: 1320px; margin-inline: auto; padding-inline: 32px; position: relative; width: 100%; }
@media (max-width: 640px) { .wrap { padding-inline: 20px; } }

a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--forest); outline-offset: 3px; border-radius: 4px; }

/* ============ BUTTONS & PILLS ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 28px; border-radius: 999px; font-size: 15px; font-weight: 600; transition: transform 150ms ease, background-color 150ms ease, box-shadow 150ms ease; width: 100%; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--forest); color: #fff; box-shadow: var(--shadow-card); }
.btn-primary:hover { background: var(--forest-2); box-shadow: var(--shadow-lift); }

/* ============ HEADER ============ */
.site-header { padding-top: 20px; }
.nav-shell { display: flex; align-items: center; justify-content: space-between; background: rgba(248,246,239,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(22,24,15,0.06); border-radius: 999px; padding: 8px 12px 8px 22px; box-shadow: var(--shadow-card); }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.logo-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--forest); display: flex; align-items: center; justify-content: center; }
.logo-mark svg { width: 17px; height: 17px; color: var(--lime); }
.header-link { font-size: 14px; font-weight: 600; color: var(--forest); padding: 8px 16px; border-radius: 999px; transition: background-color 150ms ease; }
.header-link:hover { background: rgba(22,24,15,0.05); }

/* ============ MAIN AUTH LAYOUT ============ */
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 0; position: relative; }

/* DECORATIVE BLOBS */
.blob { position: fixed; border-radius: 50%; filter: blur(70px); pointer-events: none; z-index: 0; }
.blob-1 { top: -100px; right: -120px; width: 400px; height: 400px; background: radial-gradient(circle, #C7E86B 0%, transparent 70%); opacity: 0.5; }
.blob-2 { bottom: 5%; left: -140px; width: 360px; height: 380px; background: radial-gradient(circle, #B7DD5E 0%, transparent 70%); opacity: 0.35; }
@media (max-width: 900px) { .blob { display: none; } }

/* AUTH CARD */
.auth-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-xl); padding: 40px 36px; max-width: 480px; width: 100%; box-shadow: var(--shadow-lift); position: relative; z-index: 1; }
@media (max-width: 480px) { .auth-card { padding: 32px 24px; border-radius: var(--radius-lg); } }

.auth-header { text-align: center; margin-bottom: 24px; }
.auth-header .logo-mark { margin: 0 auto 14px; width: 44px; height: 44px; border-radius: 12px; }
.auth-header .logo-mark svg { width: 24px; height: 24px; }
.auth-header h1 { font-size: 24px; font-weight: 800; color: var(--forest); letter-spacing: -0.015em; margin-bottom: 6px; }
.auth-header p { font-size: 14px; color: var(--ink-muted); }

/* FORM CONTROLS */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

.form-group { margin-bottom: 16px; }
.form-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-muted); display: block; margin-bottom: 6px; }

.input-wrap { position: relative; }
.input-wrap input { width: 100%; height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--cream); padding: 0 16px; font-size: 14.5px; color: var(--ink); transition: border-color 150ms ease, background-color 150ms ease; }
.input-wrap input:focus { border-color: var(--forest); background: var(--card); }

.input-icon-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink-muted); transition: color 150ms ease; }
.input-icon-btn:hover { color: var(--ink); }
.input-icon-btn svg { width: 18px; height: 18px; }

/* PASSWORD STRENGTH INDICATOR */
.strength-bar-wrap { margin-top: 8px; display: flex; gap: 4px; height: 4px; }
.strength-segment { flex: 1; height: 100%; background: var(--line); border-radius: 2px; transition: background-color 200ms ease; }
.strength-text { font-size: 12px; color: var(--ink-muted); margin-top: 4px; display: block; text-align: right; }

/* CHECKBOX ROW */
.terms-row { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0 24px; cursor: pointer; }
.terms-row input[type="checkbox"] { width: 18px; height: 18px; border-radius: 4px; accent-color: var(--forest); cursor: pointer; margin-top: 2px; flex-shrink: 0; }
.terms-row span { font-size: 13px; color: var(--ink-muted); line-height: 1.45; }
.terms-row a { font-weight: 600; color: var(--forest); }
.terms-row a:hover { text-decoration: underline; }

/* FOOTER CALLOUT */
.auth-footer { text-align: center; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-muted); }
.auth-footer a { font-weight: 700; color: var(--forest); transition: opacity 150ms ease; }
.auth-footer a:hover { text-decoration: underline; }

</style>
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header class="site-header">
  <div class="wrap">
    <div class="nav-shell">
      <a href="/" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-9.5-8.5C.6 8.9 2.3 5 6 5c2 0 3.3 1.1 4 2 .7-.9 2-2 4-2 3.7 0 5.4 3.9 3.5 7.5C19 16.65 12 21 12 21z"/></svg></span>
        MediFlow
      </a>
      <a href="/" class="header-link">← Back to website</a>
    </div>
  </div>
</header>

<main>
  <div class="auth-card">
    
    <div class="auth-header">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-9.5-8.5C.6 8.9 2.3 5 6 5c2 0 3.3 1.1 4 2 .7-.9 2-2 4-2 3.7 0 5.4 3.9 3.5 7.5C19 16.65 12 21 12 21z"/></svg>
      </div>
      <h1>Create Patient Account</h1>
      <p>Join MediFlow to book visits & view health records</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      
      <!-- NAME FIELDS -->
      <div class="form-row">
        <div class="form-group">
          <label for="firstName" class="form-label">First Name *</label>
          <div class="input-wrap">
            <input type="text" id="firstName" placeholder="Habib" required autocomplete="given-name">
          </div>
        </div>
        <div class="form-group">
          <label for="lastName" class="form-label">Last Name *</label>
          <div class="input-wrap">
            <input type="text" id="lastName" placeholder="Hossain" required autocomplete="family-name">
          </div>
        </div>
      </div>

      <!-- EMAIL FIELD -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address *</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>

      <!-- PHONE FIELD -->
      <div class="form-group">
        <label for="phone" class="form-label">Phone Number *</label>
        <div class="input-wrap">
          <input type="tel" id="phone" placeholder="(555) 000-0000" required autocomplete="tel">
        </div>
      </div>

      <!-- PASSWORD FIELD -->
      <div class="form-group">
        <label for="password" class="form-label">Password *</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Create strong password" required autocomplete="new-password" oninput="assessPasswordStrength(this.value)">
          <button type="button" class="input-icon-btn" id="togglePassword" aria-label="Toggle password visibility">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        
        <!-- STRENGTH METER -->
        <div class="strength-bar-wrap">
          <div class="strength-segment" id="seg1"></div>
          <div class="strength-segment" id="seg2"></div>
          <div class="strength-segment" id="seg3"></div>
          <div class="strength-segment" id="seg4"></div>
        </div>
        <span class="strength-text" id="strengthLabel">Enter a password</span>
      </div>

      <!-- CONFIRM PASSWORD FIELD -->
      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password *</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
        </div>
      </div>

      <!-- TERMS CHECKBOX -->
      <label class="terms-row">
        <input type="checkbox" id="acceptTerms" required>
        <span>I agree to MediFlow's <a href="/terms-of-service.html" target="_blank">Terms of Service</a> and acknowledge the <a href="/privacy-policy.html" target="_blank">Privacy Policy</a>.</span>
      </label>

      <!-- SUBMIT CTA -->
      <button type="submit" class="btn btn-primary">Create Free Account</button>

    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login.html">Sign in</a>
    </div>

  </div>
</main>

<script>
// PASSWORD TOGGLE
const passwordInput = document.getElementById('password');
const toggleBtn = document.getElementById('togglePassword');
const eyeIcon = document.getElementById('eyeIcon');

toggleBtn.addEventListener('click', () => {
  const isPassword = passwordInput.type === 'password';
  passwordInput.type = isPassword ? 'text' : 'password';
  eyeIcon.innerHTML = isPassword 
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.45 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

// PASSWORD STRENGTH METER
function assessPasswordStrength(val) {
  const segs = [document.getElementById('seg1'), document.getElementById('seg2'), document.getElementById('seg3'), document.getElementById('seg4')];
  const label = document.getElementById('strengthLabel');
  
  segs.forEach(s => s.style.backgroundColor = 'var(--line)');
  if (!val) { label.textContent = 'Enter a password'; return; }

  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  const colors = ['#EF4444', '#F59E0B', '#22C55E', '#16A34A'];
  const labels = ['Weak', 'Fair', 'Good', 'Strong'];

  for (let i = 0; i < score; i++) {
    segs[i].style.backgroundColor = colors[score - 1];
  }
  label.textContent = labels[score - 1] || 'Weak';
}

// REGISTRATION FORM HANDLER
function handleRegister(event) {
  event.preventDefault();
  const pass = document.getElementById('password').value;
  const confirm = document.getElementById('confirmPassword').value;

  if (pass !== confirm) {
    alert('Passwords do not match. Please verify and try again.');
    return;
  }

  // Redirect newly registered patient to their dashboard
  window.location.href = '/patient-dashboard.html';
}
</script>

</body>
</html>
